<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="config.css" />
    <link href="./_app/immutable/assets/2.B5_wlnIO.css" rel="stylesheet">
    <style>
      .ws-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1.5rem;
        height: 1.5rem;
        border-radius: var(--radius);
        border: 1px solid transparent;
        background: transparent;
        color: var(--process);
        font-size: var(--font-size);
        font-weight: var(--font-weight);
        font-family: var(--font-family);
        cursor: pointer;
        transition: color 0.15s ease;
        padding: 0;
      }
      .ws-btn:hover { color: var(--displayed); }
      .ws-btn.displayed { color: var(--displayed); }
      .ws-btn.focused-ws { color: #c084fc; }
    </style>
  </head>
  <body>
    <div class="grid grid-cols-3 items-center h-bar my-zby mx-zbx text-zb-text text-zb-size font-base">

      <!-- Left: stats -->
      <div class="flex items-center h-100 w-fit p-1 bg-zb-base border-zb-border rounded-base border shadow-bar justify-self-start">
        <div class="flex flex-row gap-3 items-center">
          <button class="flex bg-blend-30 border border-zb-border rounded-base shadow-button hover:translate-x-boxShadowX hover:translate-y-boxShadowY hover:shadow-none p-1 text-zb-icon">
            <i class="ti ti-heart-filled"></i>
          </button>
          <!-- Memory -->
          <div class="flex gap-1 items-center">
            <i class="ti ti-ruler-2"></i>
            <div class="relative inline-flex items-center justify-center group">
              <span class="inline-block w-12 h-4 border border-zb-border radius transition-all duration-300 ease-in-out group-hover:translate-y-full group-hover:opacity-0">
                <span id="memory-bar" class="block h-full border-r border-zb-border bg-zb-memory" style="width:0%"></span>
              </span>
              <span id="memory-text" class="absolute inset-0 flex items-center justify-center transform -translate-y-full opacity-0 transition-all duration-300 ease-in-out group-hover:translate-y-0 group-hover:opacity-100">0%</span>
            </div>
          </div>
          <!-- CPU -->
          <div class="flex gap-1 items-center">
            <i class="ti ti-cpu"></i>
            <div class="relative inline-flex items-center justify-center group">
              <span class="inline-block w-12 h-4 border border-zb-border radius transition-all duration-300 ease-in-out group-hover:translate-y-full group-hover:opacity-0">
                <span id="cpu-bar" class="block h-full border-r border-zb-border bg-zb-cpu" style="width:0%"></span>
              </span>
              <span id="cpu-text" class="absolute inset-0 flex items-center justify-center transform -translate-y-full opacity-0 transition-all duration-300 ease-in-out group-hover:translate-y-0 group-hover:opacity-100">0%</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Center: workspaces (tracks whichever monitor has focus) -->
      <div id="workspaces" class="flex items-center h-100 w-fit p-1 bg-zb-base border-zb-border rounded-base border shadow-bar justify-self-center gap-1">
      </div>

      <!-- Right: network -->
      <div class="flex items-center h-100 w-fit p-1 bg-zb-base border-zb-border rounded-base border shadow-bar justify-self-end">
        <div class="flex flex-row gap-3 items-center">
          <div class="flex flex-row items-center gap-1">
            <i id="network-icon" class="ti ti-wifi-off"></i>
          </div>
          <i class="ti ti-point-filled"></i>
          <span id="clock"></span>
        </div>
      </div>

    </div>

    <script type="module">
      import * as zebar from 'https://esm.sh/zebar@3';

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        cpu:     { type: 'cpu' },
        memory:  { type: 'memory' },
        network: { type: 'network' },
        date:    { type: 'date', formatting: 'EEE d MMM · HH:mm' },
      });

      providers.onOutput(render);

      function render() {
        const { glazewm, cpu, memory, network, date } = providers.outputMap;

        if (memory) {
          const pct = Math.round(memory.usage);
          document.getElementById('memory-bar').style.width = pct + '%';
          document.getElementById('memory-text').textContent = pct + '%';
        }

        if (cpu) {
          const pct = Math.round(cpu.usage);
          document.getElementById('cpu-bar').style.width = pct + '%';
          document.getElementById('cpu-text').textContent = pct + '%';
        }

        if (glazewm) {
          const focusedWsNum = parseInt(glazewm.focusedWorkspace?.name) || 0;
          const isPrimary = focusedWsNum >= 1 && focusedWsNum <= 6;

          // GlazeWM stores workspaces in children[], not workspaces[]
          const allMons = glazewm.allMonitors ?? [];
          const allWorkspaces = allMons.flatMap(m => m.children ?? m.workspaces ?? [])
            .filter(w => w.type === 'workspace' || w.name);

          const workspaces = allWorkspaces.filter(ws => {
            const n = parseInt(ws.name);
            return isPrimary ? (n >= 1 && n <= 6) : (n >= 7);
          });

          renderWorkspaces(
            workspaces.length > 0 ? workspaces : glazewm.currentWorkspaces ?? [],
            glazewm
          );
        }

        if (date) {
          document.getElementById('clock').textContent = date.formatted ?? '';
        }

        if (network) {
          const icon = document.getElementById('network-icon');
          const type = network.defaultInterface?.type;
          const strength = network.defaultGateway?.signalStrength ?? 0;
          if (type === 'wifi') {
            icon.className = strength >= 60 ? 'ti ti-wifi' : strength >= 30 ? 'ti ti-wifi-2' : 'ti ti-wifi-1';
          } else {
            // ethernet, unknown, or no interface — show cable icon
            icon.className = 'ti ti-network';
          }
        }
      }

      function renderWorkspaces(workspaces, glazewm) {
        const container = document.getElementById('workspaces');
        container.innerHTML = '';
        for (const ws of workspaces) {
          const btn = document.createElement('button');
          const n = parseInt(ws.name) || 0;
          const classes = ['ws-btn', 'ws-' + n];
          if (ws.hasFocus) classes.push('focused-ws');
          else if (ws.isDisplayed) classes.push('displayed');
          btn.className = classes.join(' ');
          btn.textContent = ws.displayName ?? ws.name;
          btn.onclick = () => glazewm.runCommand('focus --workspace ' + ws.name);
          container.appendChild(btn);
        }
      }
    </script>
  </body>
</html>
