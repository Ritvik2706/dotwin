##### =========================================================
##### mpv input.conf — existing binds + vim-like keybindings
##### (for itsmeipg/mpv-config: uosc + evafast + stats + console)
##### =========================================================

# --- Existing binds you had (kept as-is) ---------------------

MBTN_RIGHT cycle pause
SPACE cycle pause

. frame-step
, frame-back-step

LEFT script-binding evafast/evafast-rewind
RIGHT script-binding evafast/evafast
MBTN_BACK script-binding evafast/evafast-rewind
MBTN_FORWARD script-binding evafast/evafast

UP no-osd seek 84.25
DOWN no-osd seek -84.25

WHEEL_UP no-osd add volume 2
WHEEL_DOWN no-osd add volume -2

MBTN_LEFT_DBL cycle fullscreen
ESC set fullscreen no

Ctrl+c script-binding uosc/copy-to-clipboard
Ctrl+v script-binding uosc/paste-to-playlist
tab script-binding uosc/menu

` script-binding stats/display-stats-toggle
~ script-binding console/enable

# List of default binds: https://github.com/mpv-player/mpv/blob/master/etc/input.conf


# --- Vim-like keybindings (added) ----------------------------
# Philosophy:
# - h/j/k/l for navigation (seeking)
# - g/G for start/end
# - keep evafast available for "smooth scanning"
# - restore common essentials (quit, fullscreen, info, tracks, subs, speed)

# Essentials
q quit
f cycle fullscreen

# Info / stats
i script-binding stats/display-stats-toggle
I show-text "${media-title}\n${filename}\n${time-pos} / ${duration}"

# Seeking (vim-ish)
# Small moves
h seek -5
l seek 5

# Medium moves (1 minute)
j seek -60
k seek 60

# Larger moves (5 minutes)
J seek -300
K seek 300

# Optional: smooth "scan" seeking using evafast (hold key)
# Use H/L for evafast to avoid clashing with precise h/l.
H script-binding evafast/evafast-rewind
L script-binding evafast/evafast

# Start / end like vim
g seek 0 absolute
G seek 100 absolute-percent

# Chapters / playlist
u add chapter -1
o add chapter 1
< playlist-prev
> playlist-next

# Volume / mute
- add volume -2
= add volume 2
m cycle mute

# Audio / subtitles
a cycle audio
s cycle sub
v cycle sub-visibility
Alt+a add sub-scale 0.1
Alt+A add sub-scale -0.1

# Subtitle delay (fine + coarse)
z add sub-delay -0.1
x add sub-delay 0.1
Z add sub-delay -0.5
X add sub-delay 0.5

# Subtitle position
r add sub-pos -1
t add sub-pos 1

# Playback speed
[ add speed -0.05
] add speed 0.05
{ add speed -0.10
} add speed 0.10
BACKSPACE set speed 1.0

# Quick screenshot (mpv built-in command)
p screenshot

# Optional niceties
# Toggle window always-on-top
T cycle ontop

# Reset common video adjustments (safe default)
R vf toggle

# --- uosc convenience (optional, keep minimal) ---------------
# You already have TAB for menu; add a key for keybinds reference menu if the script exists.
# If the script-binding doesn't exist, it will do nothing (harmless).
? script-binding uosc/keybinds


# --- Notes ---------------------------------------------------
# mpv input.conf doesn't support multi-key chords like "gg".
# Use g = start, G = end.
